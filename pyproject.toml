[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefunc"
dynamic = ["version"]
description = "AST-level execution tracing via sys.monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/tracefunc"
Documentation = "https://AnswerDotAI.github.io/tracefunc"

[project.entry-points.nbdev]
tracefunc = "tracefunc._modidx:d"

[project.entry-points.pyskills]
tracefunc = "tracefunc.skill"

[tool.setuptools.dynamic]
version = {attr = "tracefunc.__version__"}

[tool.setuptools.packages.find]
include = ["tracefunc"]

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']
custom_sidebar = false

[tool.chkstyle]
skip_paths = ["_modidx.py"]
